databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: creatures
      changes:
        - createTable:
            tableName: creatures
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: species
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: temperament
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: daily_expenses
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: adoption_cost
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: magical_abilities
                  type: text[]
              - column:
                  name: is_adopted
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: false